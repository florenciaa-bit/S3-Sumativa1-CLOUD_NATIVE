# =====================================================================
# PARAMETROS EDITABLES
# Cada valor se puede cambiar con la variable de entorno indicada en ${...}.
# En la EC2 se definen en /home/ec2-user/tickets.env (nunca en el repo).
# =====================================================================
app:
  efs:
    ruta: ${EFS_PATH:/mnt/efs/tickets}            # carpeta del EFS montada en el contenedor
  s3:
    bucket: ${S3_BUCKET:}                          # nombre del bucket S3
    region: ${AWS_REGION:us-east-1}                # AWS Academy usa us-east-1
    subida-automatica: ${S3_SUBIDA_AUTOMATICA:true}

spring:
  application:
    name: tickets-service
  datasource:
    # Oracle Autonomous Database con wallet descomprimida en /app/wallet
    url: ${DB_URL:jdbc:oracle:thin:@ticketsdb_low?TNS_ADMIN=/app/wallet}
    username: ${DB_USER:ADMIN}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
